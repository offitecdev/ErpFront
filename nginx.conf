server {
    listen 80;
    server_name demo.offitec.ch;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # Compress the text assets emitted by Vite. The main stylesheet is roughly
    # 354 KiB minified but only ~52 KiB over the wire with gzip enabled.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    location = /backend {
        return 301 /backend/api-docs/;
    }

    location = /backend/api-docs {
        return 301 /backend/api-docs/;
    }

    location ^~ /backend/api-docs/ {
        proxy_pass http://127.0.0.1:3000/api-docs/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /backend;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /backend/swagger.json {
        proxy_pass http://127.0.0.1:3000/swagger.json;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /backend;
    }

    location ^~ /backend/api/v1/ {
        proxy_pass http://127.0.0.1:3000/api/v1/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /backend;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite fingerprints production assets, so they are safe to retain forever.
    # A new deployment generates a new URL whenever the contents change.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the entry document so it cannot point at stale chunks.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA: the worker must be re-fetched on every navigation, otherwise a
    # cached copy keeps serving the previous deployment's caching rules.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        types { } default_type application/javascript;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
